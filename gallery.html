<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>盐阜众生长卷 · 一人一页</title>
<style>body{margin:0;background:#0b1220;color:#dce5ee;font-family:system-ui,"Microsoft YaHei",sans-serif;line-height:1.8}main{max-width:900px;margin:0 auto;padding:30px 18px}a{color:#7dd3fc}h1{font-family:serif;color:#f5d69b}header{border-bottom:1px solid #334155;padding-bottom:20px}.muted{color:#9cacc0;font-size:14px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:24px}article{background:#111e30;padding:20px;border:1px solid #334155;border-radius:14px}article a{display:block;font-size:20px;text-decoration:none}button{border:1px solid #64748b;background:#17394c;color:#e2f5ff;padding:10px 20px;border-radius:9px;cursor:pointer;font-size:15px}button:disabled{opacity:.5}.timeline{padding:0;list-style:none}.timeline li{border-left:2px solid #3a677a;margin-left:8px;padding:6px 0 22px 22px}.timeline b{color:#7dd3fc}.summary{white-space:pre-line;padding:20px;background:#111e30;border-radius:14px;line-height:2}.error{color:#fda4af}#actions{display:flex;flex-wrap:wrap;gap:14px;margin:24px 0}#more{margin:24px 0}#message{min-height:24px}nav{display:flex;gap:20px}a:focus-visible,button:focus-visible{outline:3px solid #fbbf24;outline-offset:4px}</style></head>
<body><main><header><nav><a href="./">开始自己的人生</a><a href="gallery.html">浏览众生长卷</a></nav><h1 id="heading">盐阜众生长卷</h1><p class="muted">每个人都可以留下一页。这里是玩家自愿公开的虚构游戏人生，不是个人真实履历，也不按财富排名。</p></header><p id="message" role="status">正在翻开长卷……</p><div id="content"></div><div id="actions"></div><button id="more" hidden>继续翻阅</button></main>
<script>
const content=document.getElementById('content'),message=document.getElementById('message'),more=document.getElementById('more');
const id=new URLSearchParams(location.search).get('id');let offset=0;
function node(tag,text,cls){const el=document.createElement(tag);el.textContent=text;if(cls)el.className=cls;return el;}
async function read(path){const r=await fetch(path);let data;try{data=await r.json()}catch{throw Error('长卷暂时无法读取，请稍后刷新。')}if(!r.ok)throw Error(data.error||'读取失败');return data;}
async function list(){try{more.disabled=true;const data=await read('api/lives?offset='+offset);content.className='cards';for(const life of data.items){const card=node('article','');const a=node('a',life.name+'的半生');a.href='gallery.html?id='+life.id;card.append(a,node('p',life.region+' · '+life.birthYear+'年出生','muted'),node('p',life.title));content.append(card);}offset+=data.items.length;more.hidden=!data.hasMore;message.textContent=offset?'已收录 '+offset+' 页人生，点击姓名阅读全文。':'长卷还没有公开人生。完成一局后，你可以留下第一篇。';}catch(e){message.textContent=e.message;message.className='error'}finally{more.disabled=false}}
async function detail(){try{if(!/^[0-9a-f]{32}$/.test(id))throw Error('分享链接无效。');const life=await read('api/lives/'+id);document.getElementById('heading').textContent=life.name+'的半生';document.title=life.name+'的半生 · 盐阜众生长卷';content.append(node('p',life.region+' · '+life.birthYear+'—2026','muted'),node('div',life.epitaph,'summary'),node('h2','一年一年，走到这里'));const timeline=node('ol','','timeline');for(const item of life.timeline){const li=node('li','');li.append(node('b',item.year+'年 · '+item.age+'岁'),node('p',item.text));timeline.append(li);}content.append(timeline);message.textContent='这是一份已完成的游戏人生。';const actions=document.getElementById('actions');const copy=node('button','复制本页链接');copy.onclick=()=>navigator.clipboard.writeText(location.href).then(()=>{copy.textContent='已复制'}).catch(()=>{message.textContent='请复制浏览器地址栏中的网址。'});actions.append(copy);let token;try{token=JSON.parse(localStorage.getItem('yancheng80s_owned')||'{}')[id]}catch{}if(token){const remove=node('button','撤下这篇人生');remove.onclick=async()=>{if(!confirm('撤下后，其他人将不能再通过这个链接阅读。本地收藏不受影响。'))return;remove.disabled=true;try{const r=await fetch('api/lives/'+id,{method:'DELETE',headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error('撤下失败，请稍后重试');content.replaceChildren();actions.replaceChildren();message.textContent='这篇人生已撤下。';const owned=JSON.parse(localStorage.getItem('yancheng80s_owned')||'{}');delete owned[id];localStorage.setItem('yancheng80s_owned',JSON.stringify(owned));}catch(e){message.textContent=e.message;remove.disabled=false}};actions.append(remove);actions.append(node('p','撤下凭证只保存在发布时的浏览器；清除网站数据后将失去此入口。','muted'));}}catch(e){message.textContent=e.message;message.className='error'}}
more.onclick=list;if(id)detail();else list();
</script></body></html>
